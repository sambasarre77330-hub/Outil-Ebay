<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      background-color: #020617;
      color: #ffffff;
      font-family: Arial, sans-serif;
      padding: 16px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .logo {
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .logo span { color: #fbbf24; }
    .badge {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .box {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      display: block;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #020617;
      border: 1px solid #334155;
      color: white;
      padding: 7px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: 0.2s;
    }
    .btn-scrape {
      background-color: #fbbf24;
      color: #020617;
    }
    .btn-scrape:hover { background-color: #f59e0b; }
    .btn-send {
      background-color: #10b981;
      color: #020617;
    }
    .btn-ebay {
      background-color: #6366f1;
      color: #ffffff;
      margin-bottom: 0;
    }
    #status {
      font-size: 11px;
      text-align: center;
      color: #fbbf24;
      margin-top: 6px;
      min-height: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ EBX<span>.EXTENSION</span></div>
    <span class="badge">STEALTH ON</span>
  </div>

  <!-- ÉTAPE 1 : ASPIRER SUR AMAZON / ALIEXPRESS -->
  <div class="box">
    <button id="btnScrape" class="btn-scrape">🔍 1. Aspirer cette page Fournisseur</button>
    
    <span class="label">Titre détecté (SEO 80 car.) :</span>
    <input type="text" id="titreInput" placeholder="Clique sur Aspirer..." maxlength="80" />

    <div style="display: flex; gap: 8px;">
      <div style="flex: 1;">
        <span class="label">Prix Achat (€) :</span>
        <input type="number" step="0.01" id="prixAchatInput" placeholder="0.00" />
      </div>
      <div style="flex: 1;">
        <span class="label">Vente eBay (+30%) :</span>
        <input type="number" step="0.01" id="prixVenteInput" placeholder="0.00" />
      </div>
    </div>

    <button id="btnSendDashboard" class="btn-send">🚀 2. Envoyer vers mon Dashboard</button>
  </div>

  <!-- ÉTAPE 2 : AUTO-FILL SUR EBAY -->
  <div class="box">
    <span class="label">Sur une page de création d'annonce eBay :</span>
    <button id="btnFillEbay" class="btn-ebay">🤖 3. Auto-Remplir l'annonce sur eBay</button>
  </div>

  <div id="status">Prêt à automatiser.</div>

  <script src="popup.js"></script>
</body>
</html>
